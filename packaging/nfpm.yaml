# nfpm config for the .deb and .rpm packages. Variables come from build.sh.
# APP_DIR is the app without chrome-sandbox, which is added separately as setuid root.
name: unofficial-vibe-desktop
arch: amd64
platform: linux
version: ${PKG_VERSION}
release: ${PKG_RELEASE}
section: devel
priority: optional
maintainer: pangramm <70115906+pangramm@users.noreply.github.com>
description: |
  Mistral Vibe Desktop for Linux (unofficial).
  Repackaged from the official Windows installer. Not affiliated with or endorsed by Mistral AI.
vendor: unofficial-vibe-desktop-linux
homepage: https://github.com/pangramm/unofficial-vibe-desktop-linux
license: Proprietary (Mistral AI); packaging scripts MIT

depends:
  - libgtk-3-0t64 | libgtk-3-0
  - libnss3
  - libasound2t64 | libasound2
  - libgbm1
  - libxkbfile1
  - libxi6
  - libxtst6
  - xdg-utils
overrides:
  rpm:
    depends:
      - libgtk-3.so.0()(64bit)
      - libnss3.so()(64bit)
      - libasound.so.2()(64bit)
      - libgbm.so.1()(64bit)
      - libxkbfile.so.1()(64bit)
      - libXi.so.6()(64bit)
      - libXtst.so.6()(64bit)
      - xdg-utils
  archlinux:
    depends:
      - gtk3
      - nss
      - alsa-lib
      - mesa
      - libxkbfile
      - libxi
      - libxtst
      - xdg-utils
      - hicolor-icon-theme

contents:
  - src: ${APP_DIR}
    dst: /opt/unofficial-vibe-desktop
    type: tree
  - src: ${SANDBOX}
    dst: /opt/unofficial-vibe-desktop/chrome-sandbox
    file_info:
      mode: 04755
      owner: root
      group: root
  - src: ./packaging/vibe-desktop
    dst: /usr/bin/vibe-desktop
    file_info:
      mode: 0755
  - src: ./packaging/unofficial-vibe-desktop.desktop
    dst: /usr/share/applications/unofficial-vibe-desktop.desktop
  - src: ${ICON}
    dst: /usr/share/icons/hicolor/512x512/apps/unofficial-vibe-desktop.png

scripts:
  postinstall: ./packaging/scripts/post.sh
  postremove: ./packaging/scripts/post.sh

rpm:
  compression: zstd
deb:
  compression: zstd
archlinux:
  packager: pangramm <70115906+pangramm@users.noreply.github.com>
