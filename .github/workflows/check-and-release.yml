name: Check upstream & release

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if a release for this version exists"
        type: boolean
        default: false
      allow_backend_fallback:
        description: "Build even if the bundled mistral-vibe version is not on PyPI yet (release is rebuilt automatically once it is)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  BUCKET: https://storage.googleapis.com/mistralai-ci-desktop-app
  FALLBACK_MARKER: "<!-- backend-fallback -->"

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.upstream.outputs.version }}
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: astral-sh/setup-uv@v6
      - name: Read upstream latest.yml
        id: upstream
        run: |
          curl -fsSL "$BUCKET/latest.yml" -o latest.yml
          uv run --no-project --with pyyaml python - <<'EOF' >> "$GITHUB_OUTPUT"
          import re, yaml
          d = yaml.safe_load(open("latest.yml"))
          v = str(d["version"])
          assert re.fullmatch(r"\d+\.\d+\.\d+", v), f"unexpected version string: {v!r}"
          print(f"version={v}")
          EOF
          cat "$GITHUB_OUTPUT"
      - name: Decide whether to build
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.upstream.outputs.version }}
          FORCE: ${{ inputs.force }}
        run: |
          if ! body="$(gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null)"; then
            echo "No release for v$VERSION yet."; echo "build=true" >> "$GITHUB_OUTPUT"
          elif [ "$FORCE" = "true" ]; then
            echo "Forced rebuild."; echo "build=true" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$body" | grep -qF "$FALLBACK_MARKER"; then
            echo "v$VERSION was built with a fallback backend; trying again with the bundled one."
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release v$VERSION is up to date."; echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    # glibc 2.28 base with a modern compiler, so the AppImage runs on distros from ~2019 on.
    container: quay.io/pypa/manylinux_2_28_x86_64
    env:
      VERSION: ${{ needs.check.outputs.version }}
    outputs:
      skipped: ${{ steps.build.outputs.skipped }}
      backend: ${{ steps.build.outputs.backend }}
      bundled_backend: ${{ steps.build.outputs.bundled_backend }}
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y epel-release
          dnf install -y p7zip p7zip-plugins cpio unzip which findutils binutils pkgconf-pkg-config \
            libX11-devel libXi-devel libXfixes-devel libxkbfile-devel
          # Electron runtime libs (needed to verify the converted bytecode); zsync is optional.
          dnf install -y --setopt=strict=0 nss gtk3 alsa-lib mesa-libgbm libXScrnSaver libXtst cups-libs \
            libxkbcommon at-spi2-atk libdrm libXcomposite libXdamage libXrandr zsync
          echo "/opt/python/cp312-cp312/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: astral-sh/setup-uv@v6

      - name: Download and verify the official Windows installer
        run: |
          curl -fsSL "$BUCKET/latest.yml" -o latest.yml
          uv run --no-project --with pyyaml python - <<'EOF'
          import base64, hashlib, os, re, urllib.request, yaml
          d = yaml.safe_load(open("latest.yml"))
          assert str(d["version"]) == os.environ["VERSION"], "upstream moved on during the run"
          f = d["files"][0]
          assert re.fullmatch(r"vibe-\d+\.\d+\.\d+-setup\.exe", f["url"]), f"unexpected file name: {f['url']!r}"
          url = os.environ["BUCKET"] + "/" + f["url"]
          urllib.request.urlretrieve(url, "setup.exe")
          h = base64.b64encode(hashlib.sha512(open("setup.exe", "rb").read()).digest()).decode()
          assert h == f["sha512"], f"sha512 mismatch: {h}"
          print("verified", f["url"])
          open("release-notes-upstream.md", "w").write(d.get("releaseNotes", "").replace("\r\n", "\n"))
          EOF

      - name: Build AppImage
        id: build
        env:
          STRICT_BACKEND: ${{ inputs.allow_backend_fallback && '0' || '1' }}
          PACKAGES: "1"
          UPDATE_INFO: gh-releases-zsync|${{ github.repository_owner }}|${{ github.event.repository.name }}|latest|Vibe-*x86_64.AppImage.zsync
        run: |
          set +e
          ./build.sh setup.exe 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" = 3 ]; then
            echo "::notice::The mistral-vibe backend bundled with Vibe $VERSION is not on PyPI yet. Retrying on the next scheduled run."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$rc" = 0 ] || exit "$rc"
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          echo "backend=$(sed -n 's/^backend: //p' build.log | tail -1)" >> "$GITHUB_OUTPUT"
          echo "bundled_backend=$(sed -n 's/^bundled_backend: //p' build.log | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Check glibc requirement
        if: steps.build.outputs.skipped == 'false'
        run: |
          max=$(find work/Vibe.AppDir -type f \( -name '*.node' -o -name 'key-server' -o -name 'vibe' -o -name 'rg' -o -name 'agent-browser' \) \
                  -exec objdump -T {} \; 2>/dev/null | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -t. -k2,2n -u | tail -1)
          echo "Highest glibc symbol needed: $max"
          [ "$(printf '%s\n%s\n' "$max" GLIBC_2.28 | sort -t. -k2,2n | tail -1)" = GLIBC_2.28 ] || { echo "::error::needs $max (> 2.28)"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: steps.build.outputs.skipped == 'false'
        with:
          name: packages
          path: |
            dist/*
            release-notes-upstream.md
          if-no-files-found: error

  publish:
    needs: [check, build]
    if: needs.build.outputs.skipped == 'false'
    runs-on: ubuntu-24.04
    outputs:
      pages: ${{ steps.repos.outputs.pages }}
    env:
      VERSION: ${{ needs.check.outputs.version }}
      BACKEND: ${{ needs.build.outputs.backend }}
      BUNDLED: ${{ needs.build.outputs.bundled_backend }}
      GH_TOKEN: ${{ github.token }}
      SIGNING_KEY: ${{ secrets.PACKAGING_GPG_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/download-artifact@v4
        with:
          name: packages

      - name: Import signing key
        id: key
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::warning::PACKAGING_GPG_KEY secret is not set; publishing the AppImage only (no apt/dnf repositories)."
            echo "have=false" >> "$GITHUB_OUTPUT"
            rm -f dist/*.deb dist/*.rpm
            exit 0
          fi
          printf '%s\n' "$SIGNING_KEY" | gpg --batch --import
          echo "have=true" >> "$GITHUB_OUTPUT"

      - name: Sign packages and build apt/dnf repositories
        id: repos
        if: steps.key.outputs.have == 'true'
        env:
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ github.event.repository.name }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm createrepo-c dpkg-dev apt-utils pacman-package-manager libarchive-tools
          pages_url="https://${OWNER,,}.github.io/$NAME"
          rpm_base="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/"
          bash src/packaging/build-repos.sh dist site "$pages_url" "$rpm_base"
          echo "pages=true" >> "$GITHUB_OUTPUT"

      - name: Publish release
        run: |
          {
            echo "Unofficial Linux build of **Mistral Vibe Desktop $VERSION**, repackaged from the official Windows installer."
            echo
            if [ "$BACKEND" = "$BUNDLED" ]; then
              echo "- Backend: \`mistral-vibe $BACKEND\` (same as the official build)"
            else
              echo "- Backend: \`mistral-vibe $BACKEND\`. The official build bundles $BUNDLED, which is not on PyPI yet;"
              echo "  this release is replaced automatically once it is."
              echo "$FALLBACK_MARKER"
            fi
            echo "- Runs on x86_64 distros with glibc 2.28 or newer"
            echo "- Install via AppImage, \`dnf\`/\`zypper\`, \`pacman\` or \`apt\`: see the README"
            echo
            echo "Not affiliated with or endorsed by Mistral AI."
            echo
            echo "---"
            echo
            cat release-notes-upstream.md
          } > notes.md
          tag="v$VERSION"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # drop packages from an earlier build of this version (e.g. a fallback build with release 0)
            gh release view "$tag" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -E '\.(deb|rpm|pkg\.tar\.zst)$' |
              while read -r a; do gh release delete-asset "$tag" "$a" -y -R "$GITHUB_REPOSITORY"; done
            gh release upload "$tag" dist/* --clobber -R "$GITHUB_REPOSITORY"
            gh release edit "$tag" --notes-file notes.md -R "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" dist/* --title "Vibe $VERSION for Linux" --notes-file notes.md --latest -R "$GITHUB_REPOSITORY"
          fi

      - uses: actions/upload-pages-artifact@v3
        if: steps.repos.outputs.pages == 'true'
        with:
          path: site

  deploy-pages:
    needs: publish
    if: needs.publish.outputs.pages == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
